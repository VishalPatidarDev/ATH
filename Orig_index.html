<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Trading Dashboard</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 20px;
    margin: 0;
}
h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }

/* Search Bar */
.search-container {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}
input {
    padding: 12px 16px;
    width: 400px;
    max-width: 90%;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #1e293b;
    color: white;
    font-size: 16px;
    transition: all 0.2s;
}
input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

/* Table Styling */
.table-wrapper {
    overflow-x: auto;
    background: #1e293b;
    border-radius: 8px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}
table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
}
th, td {
    padding: 14px 16px;
    border-bottom: 1px solid #334155;
    text-align: left;
}
th { 
    background: #0f172a; 
    font-weight: 600; 
    color: #94a3b8;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.05em;
}
tr:hover { background: rgba(255, 255, 255, 0.02); }

/* Row Highlighting */
.high-conviction { border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.05); }

/* Badges */
.badge {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    display: inline-block;
}

/* Signal Colors */
.signal-breakout { background: #10b981; color: white; box-shadow: 0 0 10px rgba(16,185,129,0.4); }
.signal-vcp { background: #f59e0b; color: black; }
.signal-trend { background: #0ea5e9; color: white; }
.signal-dumping { background: #ef4444; color: white; }
.signal-watch { background: #475569; color: white; }
.signal-avoid { background: #334155; color: #94a3b8; }

/* RVOL Colors */
.rvol-hot { color: #10b981; font-weight: bold; }
.rvol-dead { color: #f59e0b; }

a { color: #38bdf8; text-decoration: none; font-weight: 500; }
a:hover { text-decoration: underline; }
</style>
</head>

<body>

<h1>📈 Pro ATH System: Institutional Tracker</h1>

<div class="search-container">
    <input id="search" placeholder="🔍 Search stock symbol or name...">
</div>

<div class="table-wrapper">
    <table>
    <thead>
    <tr>
        <th>Stock</th>
        <th>Symbol</th>
        <th>Price</th>
        <th>% Change</th>
        <th>RVOL</th>
        <th>Timing</th>
        <th>Score</th>
        <th>Signal</th>
        <th>Chart</th>
    </tr>
    </thead>
    <tbody id="tbody"></tbody>
    </table>
</div>

<script>
let stocks = [];

async function fetchData() {
    try {
        let res = await fetch("data.json");
        let data = await res.json();

        // Sort by Score
        stocks = data.sort((a,b) => b.score - a.score);
        render();
    } catch(e) {
        console.log("Waiting for data.json...");
    }
}

function render() {
    let tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    let search = document.getElementById("search").value.toLowerCase();

    stocks
    .filter(s => s.name.toLowerCase().includes(search) || s.symbol.toLowerCase().includes(search))
    .forEach(s => {

        let tr = document.createElement("tr");

        // Map signal string to CSS class
        let cssClass = "signal-watch";
        if (s.signal.includes("BREAKOUT")) cssClass = "signal-breakout";
        else if (s.signal.includes("VCP")) cssClass = "signal-vcp";
        else if (s.signal.includes("Trend")) cssClass = "signal-trend";
        else if (s.signal.includes("DUMPING")) cssClass = "signal-dumping";
        else if (s.signal.includes("AVOID")) cssClass = "signal-avoid";

        // Highlight high conviction rows
        if (s.rvol > 2.5) tr.classList.add("high-conviction");

        // Safe RVOL calculation
        let safeRvol = s.rvol !== undefined ? s.rvol : 0;
        let rvolHtml = safeRvol > 1.5 ? `<span class="rvol-hot">${safeRvol}x</span>` : 
                       (safeRvol > 0 && safeRvol < 0.7) ? `<span class="rvol-dead">${safeRvol}x</span>` : 
                       safeRvol === 0 ? `<span style="color: #64748b;">N/A</span>` :
                       `${safeRvol}x`;

        // Style the breakout text
        let boStyle = s.bo_days === 0 ? "color: #10b981; font-weight: bold;" : "color: #94a3b8;";

        tr.innerHTML = `
        <td><strong>${s.name}</strong></td>
        <td>${s.symbol}</td>
        <td>₹${s.price.toFixed(2)}</td>
        <td style="color: ${s.change >= 0 ? '#10b981' : '#ef4444'}">${s.change > 0 ? '+' : ''}${s.change}%</td>
        <td>${rvolHtml}</td>
        <td style="${boStyle}">📅 ${s.bo_text || "N/A"}</td>
        <td>${s.score.toFixed(1)}</td>
        <td><span class="badge ${cssClass}">${s.signal}</span></td>
        <td>
            <a href="https://in.tradingview.com/chart/?symbol=NSE:${s.symbol}" target="_blank">
            📊 View Chart</a>
        </td>
        `;

        tbody.appendChild(tr);
    });
}

document.getElementById("search").addEventListener("input", render);

// Refresh data every 60 seconds
setInterval(fetchData, 60000); 
fetchData();
</script>

</body>
</html>
